name: Release

# Push a tag like v1.2.0 (or run it by hand from the Actions tab) and this
# builds the ready-to-use Windows folder as a zip on GitHub Releases (plus a
# no separate update zip: "Perbarui sekarang" uses the same -windows.zip):
#   PCRemote.exe, HOW-TO.txt, runtime/node.exe, runtime/ffmpeg.exe (minimal,
#   tools/ffmpeg/build.sh), runtime/agent (with node_modules + version.txt).
#   cloudflared.exe is downloaded by the agent on first start. The committed
#   PCRemote.apk (latest local release build) is attached on its own as
#   PCRemote-<tag>.apk (not inside the PC zip).
# If the repo secret EXPO_TOKEN exists, the preview APK is built on EAS and
# replaces that attachment. Note: SF Pro is gitignored, so a CI-built APK uses Roboto.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Minimal static ffmpeg.exe (tools/ffmpeg/build.sh): only the capture,
  # encoders and muxers the agent uses, ~10-20 MB instead of ~100+ MB.
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: tools/ffmpeg/out/ffmpeg.exe
          key: ffmpeg-min-${{ hashFiles('tools/ffmpeg/build.sh') }}
      - name: Toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm cmake pkg-config
      - name: Build ffmpeg.exe
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash tools/ffmpeg/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-min
          path: tools/ffmpeg/out/ffmpeg.exe

  windows:
    runs-on: windows-latest
    needs: ffmpeg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-min
          path: ffmpeg-min
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Agent dependencies
        working-directory: runtime/agent
        run: |
          npm install --omit=dev --no-audit --no-fund
          node src/pointer_test.js
      # PC sound helper (audio.js compiles it on the PC too when missing/stale).
      - name: Build PCRemoteAudio.exe (PC sound helper, in-box .NET Framework csc)
        working-directory: runtime/agent
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          # Same arguments as buildHelper() in src/audio.js
          & $csc /nologo /noconfig /target:exe /platform:x64 /optimize+ /r:System.dll /out:audio\PCRemoteAudio.exe audio\PCRemoteAudio.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Prebuilt helper ships in runtime/agent/autostart; the agent still
      # compiles it on the PC if it is missing or older than the source.
      - name: Build PCRemoteStart.exe (autostart helper, in-box .NET Framework csc)
        working-directory: runtime/agent
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          # Same arguments as cscArgs() in src/autostart.js
          & $csc /nologo /noconfig /target:winexe /platform:anycpu /optimize+ /r:System.dll /out:autostart\PCRemoteStart.exe /win32icon:autostart\PCRemoteStart.ico autostart\PCRemoteStart.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vi = (Get-Item autostart\PCRemoteStart.exe).VersionInfo
          $vi | Format-List FileDescription, CompanyName, ProductName, FileVersion
          if ($vi.FileDescription -ne "PC Remote") { throw "FileDescription is '$($vi.FileDescription)'" }
      - name: Build PCRemote.exe launcher (in-box .NET Framework csc)
        shell: pwsh
        working-directory: launcher
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          function Report($out) { $out | ForEach-Object { Write-Host $_; if ("$_" -match "error|FAIL") { Write-Host "::error::$_" } } }
          $o = & $csc /nologo /noconfig /target:exe /r:System.dll /out:NetstatTest.exe NetstatTest.cs Netstat.cs 2>&1
          $rc = $LASTEXITCODE; Report $o; if ($rc -ne 0) { exit $rc }
          $o = .\NetstatTest.exe 2>&1
          $rc = $LASTEXITCODE; Report $o; if ($rc -ne 0) { exit $rc }
          $o = & $csc /nologo /noconfig /target:winexe /platform:anycpu /optimize+ /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /win32icon:..\runtime\agent\icon.ico /win32manifest:app.manifest /out:..\PCRemote.exe PCRemote.cs Netstat.cs 2>&1
          $rc = $LASTEXITCODE; Report $o; if ($rc -ne 0) { exit $rc }
          $vi = (Get-Item ..\PCRemote.exe).VersionInfo
          $vi | Format-List FileDescription, ProductName, FileVersion
          if ($vi.FileDescription -ne "PC Remote") { throw "FileDescription is '$($vi.FileDescription)'" }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path ..\PCRemote.exe))
          if (-not ([Text.Encoding]::ASCII.GetString($bytes).Contains("requireAdministrator"))) { throw "manifest missing requireAdministrator" }
      - name: Assemble folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "dist/PCRemote"
          New-Item -ItemType Directory -Force "$out/runtime" | Out-Null
          # APK is NOT in the PC zip any more (-35 MB): it is its own release asset.
          Copy-Item PCRemote.exe, HOW-TO.txt $out
          Copy-Item PCRemote.apk "dist/PCRemote-$env:TAG.apk"
          Copy-Item runtime/agent "$out/runtime/agent" -Recurse
          Set-Content "$out/runtime/agent/version.txt" $env:TAG -NoNewline
          # One zip only: the dashboard's one-click update (updates.js
          # pickUpdateAsset) falls back to this -windows.zip when no -update.zip exists.
          # node.exe = the same Node version the dependencies were installed with
          $v = node -p "process.version"
          Invoke-WebRequest "https://nodejs.org/dist/$v/win-x64/node.exe" -OutFile "$out/runtime/node.exe"
          # cloudflared is NOT bundled (-52 MB): src/tunnel.js downloads it to
          # runtime\cloudflared.exe on first start when it is missing.
          Copy-Item ffmpeg-min/ffmpeg.exe "$out/runtime/ffmpeg.exe"
          & "$out/runtime/ffmpeg.exe" -hide_banner -filters | Select-String ddagrab
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe does not run" }
          Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "folder: {0:N1} MB" -f ($_.Sum / 1MB) }
          # 7-Zip max compression (Deflate, still a normal .zip for Windows/updater).
          Push-Location dist; 7z a -tzip -mx=9 "PCRemote-$env:TAG-windows.zip" PCRemote | Out-Null; Pop-Location
          Get-ChildItem dist/*.zip | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PC Remote ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/PCRemote-${{ env.TAG }}-windows.zip
            dist/PCRemote-${{ env.TAG }}.apk

  apk:
    runs-on: ubuntu-latest
    needs: windows
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
      - name: Build preview APK on EAS
        if: env.EXPO_TOKEN != ''
        run: |
          npm ci
          npx eas-cli@latest build --profile preview --platform android --non-interactive --wait --json > build.json
          curl -L -o "PCRemote-$TAG.apk" "$(jq -r '.[0].artifacts.buildUrl' build.json)"
      - uses: softprops/action-gh-release@v2
        if: env.EXPO_TOKEN != ''
        with:
          tag_name: ${{ env.TAG }}
          files: mobile/PCRemote-${{ env.TAG }}.apk
