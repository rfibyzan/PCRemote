name: CI

# Runs on every push to main and every PR: phone unit tests + Android bundle
# check on Linux, PC agent tests on Windows (koffi/SendInput need Windows).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: |
          set -e
          for f in src/*.test.js src/*/*.test.js; do
            echo "== $f"
            node "$f"
          done
      - name: Android bundle builds
        run: npx expo export --platform android --no-bytecode --output-dir /tmp/export

  # Minimal ffmpeg.exe (tools/ffmpeg/build.sh), cached by script hash.
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: tools/ffmpeg/out/ffmpeg.exe
          key: ffmpeg-min-${{ hashFiles('tools/ffmpeg/build.sh') }}
      - name: Toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm cmake pkg-config
      - name: Build ffmpeg.exe
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash tools/ffmpeg/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-min
          path: tools/ffmpeg/out/ffmpeg.exe

  agent:
    runs-on: windows-latest
    needs: ffmpeg
    defaults:
      run:
        working-directory: runtime/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-min
          path: ffmpeg-min
      - name: Minimal ffmpeg.exe does what the agent asks of it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $bad = @()
          function Note($m) { Write-Host "::error::$m"; $script:bad += $m }
          $f = Join-Path $env:GITHUB_WORKSPACE "ffmpeg-min\ffmpeg.exe"
          if (-not (Test-Path $f)) { Note "ffmpeg.exe not found at $f"; Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter ffmpeg.exe | ForEach-Object { Write-Host $_.FullName }; exit 1 }
          "size: {0:N1} MB" -f ((Get-Item $f).Length / 1MB)
          $filters = (& $f -hide_banner -filters 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { Note "ffmpeg -filters exit $LASTEXITCODE : $($filters.Substring(0, [Math]::Min(300, $filters.Length)))" }
          foreach ($x in "ddagrab","hwdownload","scale","color") { if ($filters -notmatch "\b$x\b") { Note "filter $x missing" } }
          $enc = (& $f -hide_banner -encoders 2>&1) -join "`n"
          foreach ($x in "h264_nvenc","h264_qsv","h264_amf","libx264","mjpeg") { if ($enc -notmatch "\b$x\b") { Note "encoder $x missing" } }
          $dev = (& $f -hide_banner -devices 2>&1) -join "`n"
          foreach ($x in "gdigrab","dshow","lavfi") { if ($dev -notmatch "\b$x\b") { Note "device $x missing" } }
          # Same probe as buildProbeArgs("libx264") + FLV framing
          $o = (& $f -hide_banner -loglevel error -nostdin -f lavfi -i color=c=black:s=320x240:r=30 -frames:v 5 -vf format=yuv420p -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -g 60 -bf 0 -b:v 1000k -maxrate 1000k -bufsize 500k -an -flush_packets 1 -flvflags no_duration_filesize -y -f flv probe.flv 2>&1) -join " "
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path probe.flv)) { Note "libx264 -> flv failed ($LASTEXITCODE): $o" } else { "flv: $((Get-Item probe.flv).Length) bytes" }
          # Webcam path: scale -> mjpeg -> image2pipe
          $o = (& $f -hide_banner -loglevel error -f lavfi -i color=c=red:s=640x480:r=15 -frames:v 3 -vf scale=320:-2 -q:v 5 -y -f image2pipe -vcodec mjpeg probe.mjpg 2>&1) -join " "
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path probe.mjpg)) { Note "mjpeg failed ($LASTEXITCODE): $o" } else { "mjpeg: $((Get-Item probe.mjpg).Length) bytes" }
          # Screen path (gdigrab) may fail on a headless runner: report only
          $o = (& $f -hide_banner -loglevel error -f gdigrab -framerate 10 -draw_mouse 0 -i desktop -frames:v 3 -vf "scale=320:-2,format=yuv420p" -c:v libx264 -preset ultrafast -y -f flv gdi.flv 2>&1) -join " "
          $gs = if (Test-Path gdi.flv) { (Get-Item gdi.flv).Length } else { 0 }
          Write-Host "::notice::gdigrab exit $LASTEXITCODE, $gs bytes $o"
          if ($o -match "no decoder") { Note "gdigrab: $o" }
          if ($bad.Count) { exit 1 }
          exit 0
      - run: node --check src/index.js
      - run: node --check src/autostart.js
      - run: node src/autostart_test.js
      - name: Build PCRemoteStart.exe (autostart helper, in-box .NET Framework csc)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          # Same arguments as cscArgs() in src/autostart.js
          & $csc /nologo /noconfig /target:winexe /platform:anycpu /optimize+ /r:System.dll /out:autostart\PCRemoteStart.exe /win32icon:autostart\PCRemoteStart.ico autostart\PCRemoteStart.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vi = (Get-Item autostart\PCRemoteStart.exe).VersionInfo
          $vi | Format-List FileDescription, CompanyName, ProductName, FileVersion
          if ($vi.FileDescription -ne "PC Remote") { throw "FileDescription is '$($vi.FileDescription)'" }
      - name: Build PCRemote.exe launcher (in-box .NET Framework csc)
        shell: pwsh
        working-directory: launcher
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          function Report($out) { $out | ForEach-Object { Write-Host $_; if ("$_" -match "error|FAIL") { Write-Host "::error::$_" } } }
          $o = & $csc /nologo /noconfig /target:exe /r:System.dll /out:NetstatTest.exe NetstatTest.cs Netstat.cs 2>&1
          $rc = $LASTEXITCODE; Report $o; if ($rc -ne 0) { exit $rc }
          $o = .\NetstatTest.exe 2>&1
          $rc = $LASTEXITCODE; Report $o; if ($rc -ne 0) { exit $rc }
          $o = & $csc /nologo /noconfig /target:winexe /platform:anycpu /optimize+ /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /win32icon:..\runtime\agent\icon.ico /win32manifest:app.manifest /out:..\PCRemote.exe PCRemote.cs Netstat.cs 2>&1
          $rc = $LASTEXITCODE; Report $o; if ($rc -ne 0) { exit $rc }
          $vi = (Get-Item ..\PCRemote.exe).VersionInfo
          $vi | Format-List FileDescription, ProductName, FileVersion
          if ($vi.FileDescription -ne "PC Remote") { throw "FileDescription is '$($vi.FileDescription)'" }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path ..\PCRemote.exe))
          if (-not ([Text.Encoding]::ASCII.GetString($bytes).Contains("requireAdministrator"))) { throw "manifest missing requireAdministrator" }
      - uses: actions/upload-artifact@v4
        with:
          name: PCRemote-launcher
          path: PCRemote.exe
      - run: node src/quit_test.js
      - run: node src/updates_test.js
      - run: node --check src/updater.js
      - run: node src/keyplan_test.js
      - run: node src/pointer_test.js
      - run: node src/unit_test.js
      - run: node src/devices_test.js
      - run: node src/video_test.js
